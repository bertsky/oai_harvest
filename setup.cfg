[metadata]
name = oai-harvest
author = Thomas Gersch
author_email = thomas.gersch@slub-dresden.de
description = simple oai harvesting module and command line tool utilizing sickle (https://github.com/mloesch/sickle)
version = attr: oai_harvest.__version__
url = https://git.slub-dresden.de/gersch/oai_harvest
license_files =
    LICENSE.txt

[options]
packages = oai_harvest
python_requires = >=3.7, <4
install_requires =
    importlib-metadata; python_version<"4.0"
    Sickle==0.7.0
    lxml==4.7.1
    click==8.0.3

[options.packages.find]
exclude = tests

# TODO: add some tests
# [options.extras_require]
# tests =
#     pytest
#     vcrpy

[options.entry_points]
console_scripts =
    oai-harvest = oai_harvest.cli:cli
